syntax = "proto3";

package candle.user.v1;

option java_multiple_files = true;
option java_package = "org.profit.candle.proto.user.v1";

import "candle/common/v1/common.proto";

message UserProfile {
  string user_id = 1;
  string nickname = 2;
  string profile_image_url = 3;
  bool deleted = 4;
  candle.common.v1.Audit audit = 5;
  string email = 6;
}

message GetMeRequest { string user_id = 1; }
message GetMeResponse { UserProfile profile = 1; }
message UpdateProfileRequest { string user_id = 1; string nickname = 2; string profile_image_url = 3; candle.common.v1.CommandMetadata command_metadata = 4; }
message UpdateProfileResponse { UserProfile profile = 1; }

// 관리자 콘솔 전용 — 전체 회원 목록 조회.
// GetMe/UpdateProfile과 달리 "요청 user_id == 인증된 actor" 검증이 없다(관리자는 남의 프로필을 본다).
// 인가 경계는 BFF의 admin 라우트 가드(ADMIN|SUPER_ADMIN JWT 검사)다 — learning-service의
// ListAdminContents와 같은 규약이며, gRPC 포트는 클러스터 내부(ClusterIP)에만 열려 있다.
message ListAdminUsersRequest {
  int32 page = 1;             // 0-based
  int32 size = 2;             // 0이면 기본 20, 상한 100
  string query = 3;           // 닉네임/이메일 부분 검색. 빈 값이면 전체
  optional bool deleted = 4;  // 탈퇴 여부 필터. 미지정이면 전체
}

message ListAdminUsersResponse {
  repeated UserProfile users = 1;
  int32 total_count = 2;
  int32 page = 3;             // 0-based (요청과 동일 기준)
  int32 size = 4;
}

service UserService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ListAdminUsers(ListAdminUsersRequest) returns (ListAdminUsersResponse);
}
