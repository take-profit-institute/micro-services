spring:
  application:
    name: candle-batch
  main:
    web-application-type: none

  datasource:
    url: ${BATCH_DB_URL:jdbc:postgresql://localhost:5432/candle?currentSchema=batch,public}
    username: ${BATCH_DB_USERNAME:candle}
    password: ${BATCH_DB_PASSWORD:candle}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:migration

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  grpc:
    server:
      port: ${BATCH_GRPC_PORT:50062}
    client:
      channel:
        market:
          target: ${BATCH_MARKET_GRPC_TARGET:static://localhost:50063}
          ssl:
            enabled: false
        stock:
          target: ${BATCH_STOCK_GRPC_TARGET:static://localhost:50060}
          ssl:
            enabled: false
        trading:
          target: ${BATCH_TRADING_GRPC_TARGET:static://localhost:50054}
          ssl:
            enabled: false
        portfolio:
          target: ${BATCH_PORTFOLIO_GRPC_TARGET:static://localhost:50055}
          ssl:
            enabled: false
        ranking:
          target: ${BATCH_RANKING_GRPC_TARGET:static://localhost:50056}
          ssl:
            enabled: false

batch:
  ranking:
    enabled: ${BATCH_RANKING_ENABLED:false}
    # portfolio-eod(16:20) 완료 후. 실행 시점에 PortfolioEodCompletionGuard가 완료 여부를 한 번 더 확인한다.
    cron: "${BATCH_RANKING_CRON:0 40 16 * * MON-FRI}"
    grpc-target: ranking
    deadline-millis: ${BATCH_RANKING_DEADLINE_MILLIS:120000}
  schedule:
    zone-id: Asia/Seoul
    smoke:
      enabled: ${BATCH_SMOKE_ENABLED:true}
      cron: "${BATCH_SMOKE_CRON:0 */1 * * * *}"
    # EOD 스냅샷. stock-candle 적재(15:45~)가 끝난 뒤 돌아야 보유 종목 종가를 DB에서 읽는다.
    # 앞서 돌면 종목마다 stock-service가 키움 on-demand 백필을 타 같은 rate limit 예산을 두 번 태운다.
    portfolio-eod:
      enabled: ${BATCH_PORTFOLIO_EOD_ENABLED:false}
      cron: "${BATCH_PORTFOLIO_EOD_CRON:0 20 16 * * MON-FRI}"
      chunk-size: ${BATCH_PORTFOLIO_EOD_CHUNK_SIZE:100}
      symbol-batch-size: ${BATCH_PORTFOLIO_EOD_SYMBOL_BATCH_SIZE:500}
    # 종목 마스터 싱크. 캔들 적재 리더가 SearchStocks(LISTED)로 이 테이블을 훑으므로 적재보다 먼저 돈다
    # (뒤에 돌면 당일 신규 상장 종목의 일봉을 하루 늦게 적재하게 된다).
    stock-sync:
      enabled: ${BATCH_STOCK_SYNC_ENABLED:false}
      cron: "${BATCH_STOCK_SYNC_CRON:0 35 15 * * MON-FRI}"
    # 일봉 캔들 적재(백필). 마감 확정(today-close 22:10)/EOD 전에 그날 일봉을 stock-service에 적재.
    #
    # 실 정규장 마감은 15:30(KST)이고 키움 일봉은 그 시점에 확정된다(CandleInterval.MARKET_CLOSE).
    # 데모 세션이 22:00까지 열려 있어도 키움 일봉과는 무관하므로 마감 직후에 돌린다.
    # 종목 수(≈2,800) / 키움 rate limit(3req/s) 때문에 정상 동작해도 최소 15분대가 걸린다.
    # today-close(22:10)까지 6시간 이상을 확보해 재시도/재실행 여지를 둔다.
    stock-candle:
      enabled: ${BATCH_STOCK_CANDLE_INGEST_ENABLED:false}
      cron: "${BATCH_STOCK_CANDLE_INGEST_CRON:0 45 15 * * MON-FRI}"
      chunk-size: ${BATCH_STOCK_CANDLE_INGEST_CHUNK_SIZE:50}
      page-size: ${BATCH_STOCK_CANDLE_INGEST_PAGE_SIZE:100}
      candle-count: ${BATCH_STOCK_CANDLE_INGEST_CANDLE_COUNT:10}
      # (a) 종목별 키움 백필을 병렬 처리하는 워커 수. 키움 REST rate limit을 고려해 조절한다.
      concurrency: ${BATCH_STOCK_CANDLE_INGEST_CONCURRENCY:8}
      # (c) 카탈로그 페이지 read 실패 skip 상한. 초과하면 잡을 FAILED로 떨군다.
      skip-limit: ${BATCH_STOCK_CANDLE_INGEST_SKIP_LIMIT:200}
      # (c) 종목 단위 백필 실패 누적 상한. 실패는 예외가 아닌 결과값으로 흘러 writer가 집계하며,
      # 초과하면(대량 장애) 남은 종목을 계속 조회하지 않고 즉시 FAILED로 떨군다.
      failure-limit: ${BATCH_STOCK_CANDLE_INGEST_FAILURE_LIMIT:200}
    market-order-book:
      enabled: ${BATCH_MARKET_ORDER_BOOK_ENABLED:false}
      cron: "${BATCH_MARKET_ORDER_BOOK_CRON:0 */1 * * * MON-FRI}"
      deadline-millis: ${BATCH_MARKET_ORDER_BOOK_DEADLINE_MILLIS:120000}
    trading:
      enabled: ${BATCH_TRADING_ENABLED:false}
      previous-close-cron: "${BATCH_TRADING_PREVIOUS_CLOSE_CRON:0 30 8 * * MON-FRI}"
      open-limit-cron: "${BATCH_TRADING_OPEN_LIMIT_CRON:0 0 9 * * MON-FRI}"
      # 데모 연장: 정규장 마감을 22:00으로 늘림에 맞춰 마감 배치도 22:00/22:10으로 이동(실 정규장은 15:30/15:40).
      market-close-cron: "${BATCH_TRADING_MARKET_CLOSE_CRON:0 0 22 * * MON-FRI}"
      today-close-cron: "${BATCH_TRADING_TODAY_CLOSE_CRON:0 10 22 * * MON-FRI}"
  grpc:
    market-target: market
    stock-target: stock
    trading-target: trading
    portfolio-target: portfolio
    read-deadline-millis: ${BATCH_GRPC_READ_DEADLINE_MILLIS:300}
    write-deadline-millis: ${BATCH_GRPC_WRITE_DEADLINE_MILLIS:1000}
    stock-sync-deadline-millis: ${BATCH_STOCK_SYNC_DEADLINE_MILLIS:120000}
    trading-batch-deadline-millis: ${BATCH_TRADING_JOB_DEADLINE_MILLIS:120000}

logging:
  level:
    org.profit.candle.batch: info
    org.springframework.batch: info
